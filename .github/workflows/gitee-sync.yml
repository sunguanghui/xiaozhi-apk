name: Gitee 同步

on:
  push:
    branches: [main]
  release:
    types: [published]
  workflow_dispatch:

jobs:
  # ── Job 1：代码同步（每次 push main 触发）────────────────────────────────────
  sync-code:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout（完整历史）
        uses: actions/checkout@v3
        with:
          fetch-depth: 0

      - name: 推送代码到 Gitee
        env:
          GITEE_TOKEN: ${{ secrets.GITEE_TOKEN }}
        run: |
          git remote add gitee "https://sunguanghui1989:${GITEE_TOKEN}@gitee.com/sunguanghui1989/xiaozhi-apk.git" 2>/dev/null || true
          # 同步 main 分支 + 所有 tag；不用 --mirror 避免推入 GitHub 私有 refs
          git push gitee HEAD:refs/heads/main --force
          git push gitee --tags --force
          echo "代码已同步到 Gitee ✅"

  # ── Job 2：发布 Release（仅当 GitHub Release 发布时触发）────────────────────
  sync-release:
    if: github.event_name == 'release' && github.event.action == 'published'
    runs-on: ubuntu-latest
    needs: sync-code
    steps:
      - name: Checkout
        uses: actions/checkout@v3

      - name: Set up Java 17
        uses: actions/setup-java@v3
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Decode keystore
        id: keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$GITHUB_WORKSPACE/release.keystore"
            echo "path=$GITHUB_WORKSPACE/release.keystore" >> $GITHUB_OUTPUT
          fi

      - name: Build Release APK
        env:
          KEYSTORE_PATH: ${{ steps.keystore.outputs.path }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: ./gradlew assembleRelease

      - name: 在 Gitee 创建 Release 并上传 APK
        env:
          GITEE_TOKEN: ${{ secrets.GITEE_TOKEN }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
          RELEASE_NAME: ${{ github.event.release.name }}
          RELEASE_BODY: ${{ github.event.release.body }}
        run: |
          python3 << 'PYEOF'
          import os, json, subprocess, glob

          token   = os.environ['GITEE_TOKEN']
          tag     = os.environ['RELEASE_TAG']
          name    = os.environ.get('RELEASE_NAME', tag)
          body    = os.environ.get('RELEASE_BODY', '')

          owner = 'sunguanghui1989'
          repo  = 'xiaozhi-apk'

          # ── 创建 Gitee Release ──────────────────────────────────────────────
          payload = json.dumps({
              'access_token': token,
              'tag_name': tag,
              'name': name,
              'body': body,
              'target_commitish': 'main',
              'prerelease': False
          })

          r = subprocess.run(
              ['curl', '-s', '-X', 'POST',
               f'https://gitee.com/api/v5/repos/{owner}/{repo}/releases',
               '-H', 'Content-Type: application/json',
               '-d', payload],
              capture_output=True, text=True
          )
          print('创建 Release 响应:', r.stdout[:500])

          resp = json.loads(r.stdout)
          release_id = resp.get('id')
          if not release_id:
              print('❌ 创建 Gitee Release 失败，可能 tag 已存在')
              # 尝试获取已有 release
              r2 = subprocess.run(
                  ['curl', '-s',
                   f'https://gitee.com/api/v5/repos/{owner}/{repo}/releases/tags/{tag}',
                   '-H', f'Authorization: token {token}'],
                  capture_output=True, text=True
              )
              resp2 = json.loads(r2.stdout)
              release_id = resp2.get('id')
              if not release_id:
                  exit(1)
              print(f'使用已有 Release ID: {release_id}')
          else:
              print(f'✅ Gitee Release 创建成功，ID: {release_id}')

          # ── 上传 APK ───────────────────────────────────────────────────────
          apk_list = glob.glob('app/build/outputs/apk/release/*.apk')
          if not apk_list:
              print('⚠️  未找到 APK 文件，跳过上传')
          else:
              apk = apk_list[0]
              print(f'上传 APK: {apk}')
              up = subprocess.run(
                  ['curl', '-s', '-X', 'POST',
                   f'https://gitee.com/api/v5/repos/{owner}/{repo}/releases/{release_id}/attach_files',
                   '-H', f'Authorization: token {token}',
                   '-F', f'file=@{apk};type=application/vnd.android.package-archive'],
                  capture_output=True, text=True
              )
              print('上传结果:', up.stdout[:500])
              if '"browser_download_url"' in up.stdout:
                  print('✅ APK 上传成功')
              else:
                  print('⚠️  APK 上传可能失败，请检查')
          PYEOF
